<!doctype html>
<html>
  <head>
    <title>Filter</title>
    <style>
      body {
        text-align: center;
      }
      img {
        margin: 50px auto;
        filter: saturate(50%);
      }
      /* Filter
        blur(px) = untuk membuat gambar menjadi blur
        brightness(%) = untuk mengatur kecerahan gambar
        contrast(%) = untuk mengatur kontras gambar
        saturate(%) = untuk mengatur saturasi gambar
        grayscale(%) = untuk mengatur tingkat keabuan gambar
        sepia(%) = untuk mengatur tingkat keabuan gambar
        hue-rotate(deg) = untuk mengatur warna gambar
        invert(%) = untuk mengatur warna gambar menjadi negatif
        opacity(%) = untuk mengatur tingkat transparansi gambar
        drop-shadow(px px px color) = untuk mengatur bayangan gambar
        */
    </style>
  </head>
  <body>
    <img src="nur2213.jpg" />
  </body>
</html>
