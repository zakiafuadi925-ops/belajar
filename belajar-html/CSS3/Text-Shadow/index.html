<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Text Shadow</title>
    <style>
      .h11 {
        font-size: 100px;
        font-family: arial;
        text-align: center;
        text-shadow:
          5px 5px 10px green,
          -5px -5px 10px red;
        /* 5px -5px 10px blue,
          -5px 5px 10px yellow; */
      }
      .h12 {
        font-size: 100px;
        font-family: arial;
        text-align: center;
        color: white;
        text-shadow: 0 2px 1px black;
      }
    </style>
  </head>
  <body>
    <h1 class="h11">Hello World</h1>
    <br /><br />
    <h1 class="h12">Hello world</h1>
  </body>
</html>
