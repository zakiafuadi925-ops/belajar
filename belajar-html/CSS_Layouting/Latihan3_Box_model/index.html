    </div>

    <div class="box2">
        <p>Margin = area transparan di sekitar box.</p>
    
    </div> 

    <div class="box3">
        <p>Border = area di sekitar content atau padding.</p>
    </div> 

    <div class="box4">
            <p>Padding = area transparan didalam kotak(antara konten atau border).</p>
        
    </div> 

    <div class="box5">
        <p>Content = isi dari box berupa teks atau gambar.</p>
    </div>
