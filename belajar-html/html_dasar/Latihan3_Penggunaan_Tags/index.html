<!DOCTYPE html>
<html lang="en">
    <head>
        <title>HTML Paragraf</title>
    </head>
    <body>
<!-- Gunakan shortcut ctrl + / -->
<!--Contoh tag p,br dan hr-->
        <h1>Welcome to My Website</h1>
        <p>This is a simple paragraph.</p>
        <br>
        <p>This is another paragraph.</p>
        <hr>
<!--Contoh tag b, i, u,-->
        <p><b>Selamat Datang</b> <i>di web pemrograman</i> </p>
        <p><u>Nama Saya Xiao Lan</u></p>
        <hr>
<!--Contoh tag strong dan em-->
        <p><strong>Pengumuman</strong>. kuliah web pemrograman pada senin 9 Maret 2026 akan <em>Diliburkan</em></p>
    </body>
</html>
