<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar - SecureApp</title>
    <style>
        /* CSS Sama dengan index.html untuk konsistensi */
        :root { --primary: #00b894; } /* Warna hijau untuk Register */
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #00b894 0%, #00cec9 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
        }
        .container {
            background: rgba(255, 255, 255, 0.9);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            width: 350px;
            text-align: center;
        }
        h2 { color: #333; margin-bottom: 25px; }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }
        .footer-link { margin-top: 20px; font-size: 14px; color: #666; }
        .footer-link a { color: var(--primary); text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Buat Akun Baru</h2>
        <form action="/register" method="POST">
            <input type="text" name="username" placeholder="Nama Lengkap" required>
            <input type="email" name="email" placeholder="Email (contoh: name@gmail.com)" required>
            <input type="password" name="password" placeholder="Password (Min. 8 Karakter)" required>
            <button type="submit">Daftar Akun</button>
        </form>
        <div class="footer-link">
            Sudah punya akun? <a href="/login">Masuk di sini</a>
        </div>
    </div>
</body>
</html>
